name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  module:
    name: module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and kernel headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc flex bison libssl-dev linux-headers-generic
      - name: Build kinjector.ko
        working-directory: source
        run: |
          KDIR="$(ls -d /usr/src/linux-headers-* | grep -v -- '-common' | sort -V | tail -n1)"
          echo "KDIR=$KDIR"
          make KDIR="$KDIR" ARCH="$(uname -m)" CROSS_COMPILE=
