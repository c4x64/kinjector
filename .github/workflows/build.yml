name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  module:
    name: module compile check — ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: f22
            tree: samsung-f22
            repo: Samsung-MT6769-Devs/kernel_samsung_f22
            branch: stock
            defconfig: f22_defconfig

          - label: gki-5.4
            tree: gki
            repo: kernel/common
            branch: android11-5.4
            defconfig: gki_defconfig

          - label: gki-5.10
            tree: gki
            repo: kernel/common
            branch: android12-5.10
            defconfig: gki_defconfig

          - label: gki-5.15
            tree: gki
            repo: kernel/common
            branch: android13-5.15
            defconfig: gki_defconfig

          - label: gki-6.1
            tree: gki
            repo: kernel/common
            branch: android14-6.1
            defconfig: gki_defconfig

          - label: gki-6.6
            tree: gki
            repo: kernel/common
            branch: android15-6.6
            defconfig: gki_defconfig

    steps:
      - uses: actions/checkout@v4
        with:
          path: kinjector

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu bc flex bison libssl-dev libelf-dev

      - name: Fetch kernel tree
        run: |
          set -euo pipefail
          if [ "${{ matrix.tree }}" = "samsung-f22" ]; then
            git clone --depth 1 --branch "${{ matrix.branch }}" \
              "https://github.com/${{ matrix.repo }}.git" kinjector/kernel
          else
            git clone --depth 1 --branch "${{ matrix.branch }}" \
              "https://android.googlesource.com/kernel/common" kinjector/kernel
          fi

      - name: Configure kernel
        working-directory: kinjector/kernel
        run: |
          set -euo pipefail
          # Vendor trees (f22) embed a hard-coded clang path that doesn't
          # exist on the runner. Override CC to the system gcc and stub out
          # the clang variable so the top-level Makefile doesn't try to
          # invoke it during defconfig / modules_prepare.
          COMMON_VARS="ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=aarch64-linux-gnu-gcc"

          make $COMMON_VARS "${{ matrix.defconfig }}"

          # Disable stack-protector knob that requires clang on vendor trees.
          # GKI defconfigs don't set it to STRONG so this is a no-op there.
          ./scripts/config --disable CONFIG_CC_STACKPROTECTOR_STRONG \
                           --enable  CONFIG_CC_STACKPROTECTOR_REGULAR \
            2>/dev/null || true

          make $COMMON_VARS modules_prepare -j"$(nproc)"

      - name: Compile-check kinjector module
        working-directory: kinjector
        run: |
          set -euo pipefail
          make -C kernel \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=aarch64-linux-gnu-gcc \
            M="$PWD/source" \
            modules \
            -j"$(nproc)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kinjector-${{ matrix.label }}
          path: |
            kinjector/source/kinjector.ko
            kinjector/source/*.mod.c
            kinjector/source/modules.order
            kinjector/source/Module.symvers
          if-no-files-found: warn
